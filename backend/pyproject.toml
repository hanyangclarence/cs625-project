[project]
name = "newslens"
version = "0.1.0"
description = "Backend pipeline for the NewsLens cross-source news comparison system."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "trafilatura>=1.12.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "dateparser>=1.2.0",
    "pydantic>=2.7.0",
    "tldextract>=5.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
newslens-run = "newslens.cli:main_run"
newslens-audit = "newslens.cli:main_audit"
newslens-ab = "newslens.cli:main_ab"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newslens*"]
